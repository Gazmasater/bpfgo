name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, generate, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install BPF build tools
        run: sudo apt-get update && sudo apt-get install --yes clang llvm

      - name: Check Go formatting
        run: |
          files=$(git ls-files '*.go')
          test -z "$(gofmt -l $files)"

      - name: Check generated BPF bindings
        run: |
          go generate ./...
          git diff --exit-code -- bpf_x86_bpfel.go

      - name: Test
        run: go test ./...

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
